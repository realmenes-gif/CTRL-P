name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache \
            libltdl-dev lld
          pip install --upgrade pip
          pip install buildozer==1.6.0 cython==3.0.11 setuptools

      - name: Rama de python-for-android
        run: |
          if ! git ls-remote --tags https://github.com/kivy/python-for-android.git | grep -q "refs/tags/v2026.05.09$"; then
            echo "Tag v2026.05.09 no encontrado: se usa master"
            sed -i 's/^p4a.branch = .*/p4a.branch = master/' buildozer.spec
          fi

      - name: Caché de buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar
        run: yes | buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Ctrl-P-APK
          path: bin/*.apk
          retention-days: 30
