name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['windows/**', 'servidor_google/**', '.github/workflows/publicar_windows.yml', '.github/workflows/probar_windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias del sistema
        run: |
          mkdir -p registro
          set -o pipefail
          {
            sudo apt-get update || true
            sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
              libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache \
              libltdl-dev lld
            sudo apt-get install -y libtinfo5 || true
            python -m pip install --upgrade pip
            python -m pip install buildozer==1.6.0 setuptools
          } 2>&1 | tee registro/1_dependencias.txt

      - name: Preparar python-for-android
        run: |
          TAG=v2026.05.09
          if ! git clone --depth 1 --branch $TAG https://github.com/kivy/python-for-android.git p4a-src; then
            echo "Tag $TAG no encontrado: se usa master"
            git clone --depth 1 https://github.com/kivy/python-for-android.git p4a-src
          fi
          # Con dos arquitecturas, p4a recrea el venv encima del anterior y deja pip roto: se recrea limpio.
          sed -i "s/shprint(host_python, '-m', 'venv', 'venv')/shprint(host_python, '-m', 'venv', '--clear', 'venv')/" p4a-src/pythonforandroid/build.py
          grep -n "'venv', '--clear'" p4a-src/pythonforandroid/build.py
          sed -i 's|^p4a.branch = .*|p4a.source_dir = ./p4a-src|' buildozer.spec
          grep -n "^p4a" buildozer.spec

      - name: Restaurar caché de buildozer
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-

      - name: Datos del servidor de Google (desde los secretos del repositorio)
        env:
          NUBE_URL: ${{ secrets.NUBE_URL }}
          NUBE_CLIENTE: ${{ secrets.NUBE_CLIENTE }}
          NUBE_SECRETO: ${{ secrets.NUBE_SECRETO }}
        run: python -c "import os; open('app/nube_datos.py','w',encoding='utf-8').write('URL_SERVIDOR = %r\nCLIENT_ID = %r\nCLIENT_SECRET = %r\n' % (os.environ['NUBE_URL'], os.environ['NUBE_CLIENTE'], os.environ['NUBE_SECRETO']))"

      - name: Compilar
        run: |
          yes | buildozer -v android debug 2>&1 | tee registro/2_compilar.txt || true
          ls -la bin/
          ls bin/*.apk

      - name: Guardar caché de buildozer
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Ctrl-P-APK
          path: bin/*.apk
          retention-days: 30

      - name: Publicar APK en la rama apk
        run: |
          mkdir -p /tmp/apk && cp bin/*.apk /tmp/apk/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .buildozer ! -name bin -exec rm -rf {} +
          cp /tmp/apk/*.apk .
          echo "run ${{ github.run_id }}" > ejecucion.txt
          git add -f *.apk ejecucion.txt
          git commit -m "APK de la ejecucion ${{ github.run_id }}"
          git push -f origin HEAD:apk

      - name: Guardar registro del error
        if: failure()
        run: |
          mkdir -p /tmp/reg && cp -r registro/. /tmp/reg/ 2>/dev/null || true
          for f in /tmp/reg/*.txt; do [ -f "$f" ] && tail -n 400 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin registro || true
          git checkout --orphan registro-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/reg/. .
          echo "run ${{ github.run_id }}" > ejecucion.txt
          git add -A
          git commit -m "Registro de la ejecucion ${{ github.run_id }}"
          git push -f origin HEAD:registro
