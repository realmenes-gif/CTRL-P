name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias del sistema
        run: |
          mkdir -p registro
          set -o pipefail
          {
            sudo apt-get update || true
            sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
              libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache \
              libltdl-dev lld
            sudo apt-get install -y libtinfo5 || true
            python -m pip install --upgrade pip
            python -m pip install buildozer==1.6.0 cython==3.0.11 setuptools
          } 2>&1 | tee registro/1_dependencias.txt

      - name: Rama de python-for-android
        run: |
          if ! git ls-remote --tags https://github.com/kivy/python-for-android.git | grep -q "refs/tags/v2026.05.09$"; then
            echo "Tag v2026.05.09 no encontrado: se usa master"
            sed -i 's/^p4a.branch = .*/p4a.branch = master/' buildozer.spec
          fi

      - name: Caché de buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee registro/2_compilar.txt

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Ctrl-P-APK
          path: bin/*.apk
          retention-days: 30

      - name: Guardar registro del error
        if: failure()
        run: |
          mkdir -p /tmp/reg && cp -r registro/. /tmp/reg/ 2>/dev/null || true
          for f in /tmp/reg/*.txt; do [ -f "$f" ] && tail -n 400 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin registro || true
          git checkout --orphan registro-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/reg/. .
          echo "run ${{ github.run_id }}" > ejecucion.txt
          git add -A
          git commit -m "Registro de la ejecucion ${{ github.run_id }}"
          git push -f origin HEAD:registro
