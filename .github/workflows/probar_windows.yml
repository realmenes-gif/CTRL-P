# Solo prueba Ctrl-P en Windows (no publica nada). Se lanza a mano.
name: Probar Ctrl-P Windows

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar librerias
        run: python -m pip install --disable-pip-version-check "customtkinter>=5.2,<6" openpyxl lxml pillow "pymupdf>=1.24,<2" cryptography
      - name: Prueba automatica
        shell: pwsh
        run: |
          python prueba\crear_prueba.py "$env:RUNNER_TEMP\prueba"
          $env:CTRLP_AUTOPRUEBA = "$env:RUNNER_TEMP\prueba\Registro_Semanal.ctrlp"
          $env:CTRLP_AUTOPRUEBA_LOG = Join-Path $PWD "autoprueba.log"
          $p = Start-Process python -ArgumentList "CtrlP.py" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error "Ctrl-P se quedo pegado (No responde)"; exit 1 }
          if (Test-Path autoprueba.log) { Get-Content autoprueba.log }
          if (-not (Select-String -Path autoprueba.log -Pattern "AUTOPRUEBA OK" -Quiet)) { Write-Error "La prueba fallo"; exit 1 }
